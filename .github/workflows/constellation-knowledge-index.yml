name: "QGIA Knowledge Index Publisher"

# CONNECTIVITY PASS 2026-08-19:
#   The hub-publish step was gated on `env.HAS_TOKEN == 'true'` where HAS_TOKEN
#   was declared in that same step's `env:` block. GitHub evaluates a step's
#   `if:` BEFORE that step's own `env:` is materialised, so the expression read
#   an empty string, the condition was never true, and this repository has never
#   published qgia.knowledge.updated to the constellation hub. HAS_TOKEN is now
#   declared at job level, where the step `if:` can see it.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.aurora/constellation.json'
      - '.aurora/closed-loop-bootstrap.json'
      - 'data/**'
      - 'scripts/*.py'
      - 'tests/**'
      - '!references/**'
      - '!policies/**'

permissions:
  contents: write

jobs:
  generate-index:
    name: Generate & Publish Knowledge Index
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      HAS_TOKEN: ${{ secrets.CONSTELLATION_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Generate knowledge index
        run: python3 scripts/generate-knowledge-index.py

      - name: Validate knowledge contract
        run: python3 scripts/validate-knowledge-contract.py

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Commit updated index
        run: |
          git config user.name "aurora-constellation[bot]"
          git config user.email "aurora-constellation[bot]@users.noreply.github.com"
          git add .aurora/knowledge-index.json
          git diff --cached --quiet || git commit -m "chore: auto-update knowledge index [skip ci]"
          git push

      - name: Warn when the hub link is unconfigured
        if: success() && env.HAS_TOKEN != 'true'
        run: echo "::warning::CONSTELLATION_TOKEN is not set — knowledge index updated locally but NOT published to the constellation hub."

      - name: Publish event to Constellation Hub
        if: success() && env.HAS_TOKEN == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4.0.1
        with:
          token: ${{ secrets.CONSTELLATION_TOKEN }}
          repository: AUo959/aurora-cloudbank-symbolic
          event-type: qgia.knowledge.updated
          client-payload: >-
            {
              "source_node": "QGIA-CORPUS",
              "source_repo": "qgia-knowledge-library",
              "event_type": "qgia.knowledge.updated",
              "correlation_id": "${{ github.run_id }}-${{ github.run_number }}",
              "timestamp": "${{ github.event.head_commit.timestamp }}",
              "hop": 0,
              "provenance": {
                "charter": "Picard_Delta_3",
                "l3_compliance": true
              },
              "payload": {
                "commit_sha": "${{ github.sha }}",
                "index_url": "https://raw.githubusercontent.com/AUo959/qgia-knowledge-library/main/.aurora/knowledge-index.json"
              }
            }
